# Companies whose latest 10-K is in the corpus. Aliases are matched case-insensitively
# on word boundaries; tickers are matched only when written in upper case. Subsidiaries
# route a question to the parent's filing but stay in the query as retrieval terms.
covered:
  AAPL: { name: Apple, aliases: [apple, apple inc] }
  MSFT: { name: Microsoft, aliases: [microsoft], subsidiaries: [linkedin, github, activision blizzard] }
  GOOGL: { name: Alphabet, aliases: [alphabet, google, goog], subsidiaries: [youtube] }
  AMZN: { name: Amazon, aliases: [amazon, amazon.com], subsidiaries: [aws, amazon web services] }
  META: { name: Meta Platforms, aliases: [meta, meta platforms, facebook], subsidiaries: [instagram, whatsapp] }
  NVDA: { name: NVIDIA, aliases: [nvidia] }
  TSLA: { name: Tesla, aliases: [tesla] }
  JPM: { name: JPMorgan Chase, aliases: [jpmorgan, jp morgan, jpmorgan chase, jpmc, j.p. morgan] }
  JNJ: { name: Johnson & Johnson, aliases: [johnson & johnson, johnson and johnson, "j&j", jnj] }
  XOM: { name: Exxon Mobil, aliases: [exxon, exxonmobil, exxon mobil] }

# Well-known companies that are NOT in the corpus. A question that names one of these and
# none of the covered companies gets the specific "this service covers ..." refusal.
