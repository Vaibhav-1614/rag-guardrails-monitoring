[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-guardrails-monitoring"
version = "0.1.0"
description = "Guardrails and drift monitoring for a SEC 10-K RAG service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Sharma" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ml: needs optional Hugging Face models (skipped when unavailable)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["rag", "guards", "monitor"]
